services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    environment:
      # O frontend do Compose fala com a API pelo proxy do nginx (mesma origem) e não
      # precisa de CORS. Defina CORS_ORIGINS só para outra origem chamar a API direto.
      CORS_ORIGINS: "${CORS_ORIGINS:-}"
    volumes:
      - catalog-data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/docs-json').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  catalog-data: